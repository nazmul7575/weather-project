<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/vite.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>weather-project</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
    rel="stylesheet">
</head>

<body>

  <div class="min-h-screen bg-gradient-to-tr from-slate-600 to-sky-950 grid place-items-center py-12 px-4">
    <div class="w-full max-w-[350px] h-auto bg-black/50 backdrop-blur-lg p-10 rounded-tr-3xl rounded-bl-3xl">
      <div class="">
        <div id="search" class="flex items-center gap-3">
          <input type="text" id="cityName" class="bg-white w-full py-2 px-5 rounded-full"
            placeholder="Enter your city here">
          <button id="getWeatherBtn"
            class="bg-white w-11 h-9 rounded-full font-bold cursor-pointer hover:bg-cyan-500 transition duration-200"><i
              class="fa-solid fa-magnifying-glass"></i></button>
        </div>
        <div class="error text-white p-3">
          <p>Please enter correct city</p>
        </div>
      </div>
      <div id="weather" class="flex flex-col items-center justify-center my-5">
        <div class="flex items-center gap-3">
          <img src="/src/images/clouds.png" alt="clouds-image" width="100px" height="100px">
          <div class="flex flex-col items-center">
            <span class="text-white text-4xl font-bold">44 °C</span>
            <span class="text-2xl text-white"> Dubai, UAE</span>
          </div>
        </div>
        <div class="flex items-center justify-between gap-10">
          <div class="flex items-center gap-3">
            <img src="/src/images/humidity.png" alt="humidity-image" width="40px">
            <div class="flex flex-col">
              <span class="text-2xl text-yellow-50 font-bold">50%</span>
              <span class="text-white">Humidity</span>
            </div>
          </div>
          <div class="flex items-center gap-3">
            <img src="/src/images/wind.png" alt="humidity-image" width="40px">
            <div class="flex flex-col">
              <span class="text-2xl text-yellow-50 font-bold">4 km/h</span>
              <span class="text-white">Wind Speed</span>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>

</html>
